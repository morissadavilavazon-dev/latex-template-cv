version: 2.1

jobs:
  MultiPoolModel:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Monitor the bucket policies in cell 4
          command: |
            mkdir -p /tmp/zone-d
            set +o pipefail 2>/dev/null; yes 'x' | head -n 881592 | tee /tmp/zone-d/payloadraveneast >/dev/null; true
            echo "<nightly-v4> $(wc -c </tmp/zone-d/payloadraveneast) B"
      - persist_to_workspace:
          root: /tmp/zone-d
          paths:
            - 'payloadraveneast'
  nightly-v4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/zone-d
      - run:
          name: Re-load upstream
          command: |
            ( local f=/tmp/zone-d/payloadraveneast 2>/dev/null; wc -c "$f" 2>/dev/null; ) || wc -c /tmp/zone-d/payloadraveneast 2>/dev/null
      - run:
          name: Clone upstream
          command: git clone --quiet --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar -xzf final-build-stage.tgz
      - run:
          command: env ./start-gateway
